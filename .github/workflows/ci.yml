# CI — Phase-0 verification gates.
#
# Mirrors the Makefile targets and PLAN.md Part C gates:
#   backend  -> migrate + go build / vet / test (against a pgvector/pgvector:pg16-trixie
#               service — Postgres 16 + pgvector; 0098's vector half is required here)
#   frontend -> pnpm install + vitest + tsc
#   corpora  -> python corpora/validate.py (the golden-corpus gate)
#   security -> gitleaks + semgrep + trivy fs
#   iac      -> terraform fmt/validate (required) + kustomize build
#
# Least-privilege: the workflow defaults to read-only token; jobs that need more
# (SARIF upload) opt in locally.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Default-deny token: read-only. Jobs widen this only where required.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"

jobs:
  # --------------------------------------------------------------------------
  backend:
    name: backend (go build/vet/test + migrate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        # pgvector/pgvector:pg16 is the official postgres:16 image plus the
        # pgvector extension (a Postgres extension, not a Go module — §1.1
        # does not reach it). Migration 0098 would degrade to lexical-only on
        # plain postgres:16; EMB_REQUIRE_VECTOR below makes that a failure
        # HERE, so CI cannot silently lose the vector half. -trixie: the same
        # Debian (glibc 2.41) as postgres:16 and docker-compose.yml, so CI and
        # dev sort text identically (docker-compose.yml says why it matters).
        image: pgvector/pgvector:pg16-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tally
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tally"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Match the Makefile connection conventions (admin for migrate, app for tests).
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5433/tally?sslmode=disable
      DATABASE_URL: postgres://tally_app:tally_app@localhost:5433/tally?sslmode=disable
      EMB_REQUIRE_VECTOR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Apply migrations
        working-directory: backend
        run: go run ./cmd/cored migrate

      - name: Build + vet
        working-directory: backend
        run: |
          go build ./...
          go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./... -count=1

  # --------------------------------------------------------------------------
  # W8 Tier 0 (PLAN-AGENTIC.md §3 W8): replay every recorded cassette with no
  # LLM, no provider key, no network egress and no database, on every PR.
  #
  # ⛔ THIS JOB IS SEPARATE FROM `backend` ON PURPOSE, AND THE SEPARATION IS THE
  # GATE. The same tests already run inside `backend` — but that job has a
  # Postgres service and an unrestricted network, so a replay path that quietly
  # acquired either would stay green there forever. Here there is no service
  # container and no credential to find, so "cassette replay needs neither"
  # is enforced by the environment rather than asserted by a comment.
  #
  # Missing entry points fail every job; no presence guards hide skipped work.
  tier0:
    name: tier0 (cassette replay — no LLM, no network, no database)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # Fetch modules while the network is still usable, so the replay step
      # itself can run in a network namespace with no external interfaces.
      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Replay cassettes
        working-directory: backend
        env:
          # No DATABASE_URL and no ADMIN_DATABASE_URL are set in this job at
          # all; CORED_SKIP_DB makes that an intended state rather than a
          # missing-config failure.
          CORED_SKIP_DB: "1"
          # ⛔ MUST BE EMPTY. With TRAJECTORY_RECORD set, TestSeedCassettes
          # REWRITES the fixtures and asserts nothing, and the census then
          # counts bytes no reviewer saw. TestTier0ReplaysEveryCassetteInTheRepo
          # and TestSeedCassettesAreCheckedIn both Fatal if it is set, so this
          # line is belt to their braces.
          TRAJECTORY_RECORD: ""
          # No LLM_API_KEY, no LLM_PROVIDER, no OTEL endpoint: the shipped
          # default is hermetic and this job is what proves it stays so.
          GOFLAGS: -mod=readonly
          GOPROXY: "off"
        # The WHOLE package, not a `-run` regex over the Tier-0 test names. A
        # regex is a list that rots: the next Tier-0 test whose name does not
        # match it would be silently skipped here while looking present in the
        # tree. internal/trajectory has allowedDeps {} (archtest pins it), so
        # running all of it costs nothing and can never need a service.
        #
        # Repo-wide coverage comes from the TEST, not from this package list:
        # TestTier0ReplaysEveryCassetteInTheRepo walks the whole backend module
        # for testdata/cassettes, so cassettes recorded by internal/llm (W1b) or
        # internal/agent (W2) are replayed by this job without editing it.
        run: |
          go test -c ./internal/trajectory/ -o "$RUNNER_TEMP/trajectory.test"
          cd internal/trajectory
          sudo unshare --net -- bash -c '
            ip link set lo up
            exec env CORED_SKIP_DB=1 TRAJECTORY_RECORD= TIER0_NETWORK_ISOLATED=1 "$1" -test.v -test.count=1
          ' bash "$RUNNER_TEMP/trajectory.test"

  # --------------------------------------------------------------------------
  frontend:
    name: frontend (vitest + tsc)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Unit tests (vitest)
        working-directory: frontend
        # ⛔ `pnpm run test:run`, NEVER `pnpm test -- --run`. The `test` script is
        # bare `vitest` = WATCH mode, and under pnpm 9+ the `-- --run` forwarding
        # no longer reaches vitest — so that spelling hangs until the job times
        # out instead of failing on a red test. Makefile:89-93 carries the same
        # note for the same reason. This step is what makes a STALE
        # src/api/goldens/ui-commands.json turn CI red (its staleness golden is
        # in uiCommandManifest.test.ts, and the Go W0 coverage test reads that
        # file), so a gate that can only hang is a gate the manifest does not
        # have.
        run: pnpm run test:run

      - name: Type-check (tsc)
        working-directory: frontend
        # Prefer an explicit typecheck script; fall back to a no-emit tsc pass.
        run: |
          if pnpm run | grep -qE '^\s*typecheck'; then
            pnpm run typecheck
          else
            pnpm exec tsc --noEmit
          fi

  # --------------------------------------------------------------------------
  corpora:
    name: corpora (golden-corpus validator)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate golden corpora
        run: |
          if [ -f corpora/validate.py ]; then
            python3 corpora/validate.py
          elif [ -f corpora/validate.sh ]; then
            bash corpora/validate.sh
          else
            echo "::error::no corpora/validate.* found"
            exit 1
          fi

  # --------------------------------------------------------------------------
  insightd:
    name: insightd (core-only pytest + import-lint + accuracy floor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CORE deps only (no anthropic/paddleocr/presidio)
        working-directory: insightd
        # Installs the exact core + test profile — proves the core needs none of
        # the optional extras. The import-lint test asserts no top-level heavy
        # imports anywhere in the package.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Import-without-heavy-deps smoke check
        working-directory: insightd
        run: python -c "import insightd, insightd.api.app, insightd.pipeline; print('core import OK')"

      - name: Generate + validate labeled corpus
        working-directory: insightd
        run: |
          python -m insightd.benchmark.gen_corpus
          python -m insightd.benchmark.validate

      - name: Pytest (fakes only — PII boundary, HITL invariant, accuracy floor)
        working-directory: insightd
        run: python -m pytest -q

  # The core-only job stays dependency-light. This separate job must execute
  # the real database isolation/durability tests; unavailable DBs are failures.
  insightd-db:
    name: insightd (required PostgreSQL integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tally
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tally"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5433/tally?sslmode=disable
      INSIGHTD_DATABASE_URL: postgres://tally_app:tally_app@localhost:5433/tally?sslmode=disable
      INSIGHTD_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Apply real migrations
        working-directory: backend
        run: go run ./cmd/cored migrate
      - name: Install resolved database test profile
        run: python -m pip install -r insightd/requirements-db-test.txt
      - name: Run database suite (missing database cannot skip)
        working-directory: insightd
        run: |
          python -m pytest tests/test_pg_store.py -v --junitxml=db-results.xml
          python - <<'PYTEST'
          import xml.etree.ElementTree as ET
          suites = ET.parse('db-results.xml').getroot().findall('testsuite')
          assert sum(int(s.get('tests', 0)) for s in suites) >= 10, 'database tests did not run'
          assert sum(int(s.get('skipped', 0)) for s in suites) == 0, 'database tests skipped'
          PYTEST

  # --------------------------------------------------------------------------
  security:
    name: security (gitleaks + semgrep + trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --retry 3 "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          curl --fail --location --retry 3 "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          expected=$(awk -v file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" '$2 == file {print $1}' checksums.txt)
          test -n "$expected"
          printf '%s  gitleaks.tar.gz\n' "$expected" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Prove secret scan history coverage
        run: python3 scripts/ci/test_secret_scan.py

      - name: gitleaks (complete commit graph)
        env:
          SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/scan-secrets.sh

      - name: Preserve redacted secret scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-redacted
          path: gitleaks.json
          if-no-files-found: warn

      - name: Prepare exact Python dependency inventory
        run: python3 scripts/ci/python_inventory.py

      - name: Audit every Python dependency profile
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: security-python-locks
          scanners: vuln
          format: json
          output: python-trivy.json
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
        env:
          TRIVY_LIST_ALL_PKGS: "true"
          TRIVY_IGNOREFILE: .trivyignore.yaml

      - name: Prove Python vulnerability gate
        run: python3 scripts/ci/test_python_scan.py

      - name: Refuse missing Python scanner targets
        if: always()
        run: python3 scripts/ci/python_inventory.py python-trivy.json

      # ⛔ semgrep-action@v1 ran semgrep 1.36 (2023). It CRASHED on today's
      # registry rules ("invalid rule severity value: MEDIUM") and the step
      # still reported success, so SAST had never scanned this tree. Now a
      # pinned current image: every finding is printed, and ERROR-severity
      # findings fail the job.
      - name: semgrep (SAST)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 \
            semgrep scan --metrics=off \
              --config infra/security/semgrep.yml --config p/default --config p/secrets
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 \
            semgrep scan --metrics=off --quiet --error --severity ERROR \
              --config infra/security/semgrep.yml --config p/default --config p/secrets

      - name: Prove Semgrep scanner errors fail
        run: |
          printf 'rules: [{id: invalid-control, languages: [python], severity: ERROR}]\n' > "$RUNNER_TEMP/invalid-semgrep.yml"
          if docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/invalid-semgrep.yml:/invalid.yml:ro" -w /src \
            semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 \
            semgrep scan --metrics=off --config /invalid.yml scripts/ci; then
            echo '::error::Semgrep accepted an invalid rule'
            exit 1
          fi

      - name: trivy (filesystem vuln + secret + misconfig)
        # Upstream moved to v-prefixed tags; the bare "0.24.0" no longer
        # resolves, and the job died in setup before scanning anything. Same
        # release, pinned by commit so a moved tag cannot change what runs.
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          version: v0.76.1
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          # Without this the action DROPS `severity` for SARIF output, so every
          # MEDIUM/LOW finding tripped exit-code 1 while the table step, which
          # does honour it, reported 0 failures (measured on PR #1).
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
        # NOT the action's `trivyignores` input: it concatenates the files into
        # ./trivyignores, which trivy reads as the PLAIN format, so a YAML
        # file's path-scoped entries were silently dropped (measured on PR #1).
        # The env var keeps the .yaml name, and with it the format.
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml

      # The SARIF above is for the dashboard; this prints the same findings in
      # the log, where a failing run can actually be read.
      - name: trivy findings (table)
        if: failure()
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          version: v0.76.1
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml

      - name: Preserve scanner reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: |
            trivy.sarif
            python-inventory.json
            python-trivy.json
          if-no-files-found: warn

      # The UPLOAD is best-effort; the SCAN is the gate. trivy's exit-code "1"
      # above still fails this job on any CRITICAL/HIGH finding. Code scanning
      # on a private repository needs GitHub Advanced Security, which this
      # repo may not have, and a missing dashboard must not fail a scan that
      # found nothing — nor mask one that did.
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: trivy.sarif

  # --------------------------------------------------------------------------
  iac:
    name: iac (terraform fmt/validate + kustomize build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build Lambda artifact for validation
        run: bash infra/aws/build.sh

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.5"

      - name: Assert reviewed network defaults and regression controls
        run: python3 scripts/ci/test_iac_defaults.py

      - name: terraform fmt
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/aws fmt -check -recursive

      - name: terraform validate
        run: |
          for stack in infra/terraform infra/aws; do
            terraform -chdir="$stack" init -backend=false -lockfile=readonly
            terraform -chdir="$stack" validate
          done

      # kubectl ships kustomize built in and is preinstalled on the runner. The
      # old step piped kustomize's install script from its MASTER branch into
      # bash, which executed whatever was on master at that moment (semgrep
      # gha-curl-pipe-shell).
      - name: kustomize build dev overlay
        run: kubectl kustomize infra/k8s/overlays/dev > /dev/null

      - name: Validate YAML parses (observability, k8s, security)
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          files = []
          for pat in ("infra/k8s/**/*.yaml", "infra/observability/**/*.yaml"):
              files += glob.glob(pat, recursive=True)
          bad = 0
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:  # noqa: BLE001
                  print(f"::error file={f}::YAML parse failed: {e}")
                  bad += 1
          print(f"checked {len(files)} YAML files, {bad} bad")
          sys.exit(1 if bad else 0)
          PY
