# gitleaks configuration — secret scanning for the monorepo.
#
# Extends the upstream default ruleset (AWS keys, private keys, tokens, etc.)
# and adds project-specific rules + an allowlist for the KNOWN, intentional
# dev-only credentials (the local Postgres password is `tally_app`/`postgres`
# on port 5433 — see Makefile/docker-compose). Those are not secrets; flagging
# them would train developers to ignore gitleaks.
#
# CI:  gitleaks detect --config infra/security/.gitleaks.toml --redact --no-banner

title = "tally gitleaks config"

# Pull in gitleaks' built-in rules, then add ours below.
[extend]
useDefault = true

[[rules]]
id = "india-pan"
description = "Indian PAN (Permanent Account Number) committed in source"
# 5 letters, 4 digits, 1 letter.
regex = '''\b[A-Z]{5}[0-9]{4}[A-Z]\b'''
tags = ["pii", "india", "dpdp"]

[[rules]]
id = "india-gstin"
description = "Indian GSTIN committed in source"
# 2-digit state + 10-char PAN-shaped + entity + Z + checksum.
regex = '''\b[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z]Z[0-9A-Z]\b'''
tags = ["pii", "india", "dpdp"]

[[rules.allowlists]]
description = "Synthetic W5 benchmark GSTINs and the published checksum example (reviewed October 2026)"
condition = "AND"
regexTarget = "match"
regexes = ['''\b(?:27ABCDE1234F1Z[05]|27AAPFU0939F1ZV|27AABCA1234B1Z2|29ZZZZZ0000Z1Z5)\b''']
paths = [
  '''^insightd/insightd/benchmark/(?:corpus/[^/]+\.json|gen_corpus\.py)$''',
  '''^insightd/insightd/validators/gstin\.py$''',
  '''^insightd/tests/test_(?:api|validators|openweight_adapter|evals_extraction)\.py$''',
  '''^docs/design/d123-w5-documents-bank\.md$''',
  '''^frontend/src/screens/reports/GSTR9Screen\.test\.tsx$''',
]

[[rules.allowlists]]
description = "Synthetic tau company GSTIN echoed in the dated Fireworks evaluation results"
condition = "AND"
regexTarget = "match"
regexes = ['''\b27AAACK1234A1ZA\b''']
paths = ['''^docs/evals/fireworks-2026-10-21\.json$''']

[[rules]]
id = "india-aadhaar"
description = "Possible Aadhaar number (12 digits) committed in source"
regex = '''\b[2-9][0-9]{3}\s?[0-9]{4}\s?[0-9]{4}\b'''
tags = ["pii", "india", "dpdp"]

[allowlist]
description = "Known dev-only fixtures and local credentials — not real secrets"
# Local dev DB creds (postgres/postgres, tally_app/tally_app on :5433) are
# intentional and documented; CI/Make/compose reference them.
regexes = [
  '''tally_app:tally_app''',
  '''postgres:postgres''',
  # SYNTHETIC GSTINs/PANs keyed by the browser drive scripts
  # (frontend/scripts/drive-*.mjs). They are allowed BY VALUE, not by path, so
  # a real GSTIN pasted into a drive script still fails this scan:
  #   29AABCU9603R1ZM  the sample GSTIN published in GST documentation
  #   29AAACA1111A1Z5  a made-up Karnataka party
  #   ABCPD1234E, ABCPD9999F  made-up employee PANs (drive-payroll)
  #   AAACP1234A              a made-up Form 138 deductor PAN
  '''29AABCU9603R1ZM''',
  '''29AAACA1111A1Z5''',
  '''ABCPD1234E''',
  '''ABCPD9999F''',
  '''AAACP1234A''',
]
paths = [
  '''Makefile''',
  '''docker-compose\.yml''',
  '''\.github/workflows/.*\.ya?ml''',
  '''corpora/.*''',          # synthetic golden fixtures, no real PII
  '''.*\.example$''',
  '''.*/testdata/.*''',
  '''.*_test\.go''',
]
