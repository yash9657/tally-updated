# Default-deny NetworkPolicy: with no other policy selecting a pod, all
# ingress and egress is denied in the `tally` namespace. Per-plane policies
# (below) then re-open ONLY the flows each plane needs. This is the
# zero-trust baseline — a compromised pod cannot freely talk to the cluster
# or the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tally
spec:
  podSelector: {} # selects every pod in the namespace
  policyTypes:
    - Ingress
    - Egress
---
# Allow all pods to resolve DNS via kube-dns (egress UDP/TCP 53). Without this,
# default-deny egress breaks every name lookup.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: tally
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# cored ingress: accept HTTP only from the ingress controller namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cored-ingress
  namespace: tally
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cored
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# statutoryd ingress: only cored may call it (mTLS service-to-service).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: statutoryd-ingress
  namespace: tally
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: statutoryd
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cored
      ports:
        - protocol: TCP
          port: 8080
---
# insightd ingress: only cored may call it.
#
# ⚠️ THIS CLAIM WAS ASPIRATIONAL UNTIL 2026-08-24 AND IS NOW A SECOND CONTROL.
# When it was written there was NO cored proxy — insightd authenticated nobody,
# answered twelve routes anonymously, and the browser reached it same-origin
# through the dev server. So this policy was the ONLY thing standing between a
# tenant's supplier bills and anyone who could open a socket, and it has never
# been applied to a cluster.
#
# Register row D49 built the proxy: the drafts are cored routes
# (/v1/companies/{id}/drafts...) judged by cored's PDP, and insightd refuses any
# request that does not present the shared service credential AND the company
# cored authorized. So this rule is now defence in depth rather than the whole
# defence — which is the right relationship between a network policy and an
# application control.
#
# ⛔ BUT IT IS NOT COMPLETE ON ITS OWN: nothing in infra/ yet delivers
# INSIGHTD_SERVICE_TOKEN to both pods. Without it cored refuses to forward (503,
# naming the variable) and insightd refuses every company-scoped route (503,
# "unconfigured"). Two loud refusals rather than a quiet open door — but the
# Bill Inbox will not work until the secret is wired. There is also no
# Dockerfile for insightd in this repository, so this manifest set cannot be
# applied as-is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insightd-ingress
  namespace: tally
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: insightd
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cored
      ports:
        - protocol: TCP
          port: 8000
