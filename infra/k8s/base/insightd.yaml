# insightd — the AI insight plane (Python/FastAPI). Sits BESIDE the ledger,
# never in the keystroke loop; reads a Postgres read-replica and proposes
# confidence-scored vouchers via the same human-approved API (PLAN.md A.1/B.6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insightd
  namespace: tally
  labels:
    app.kubernetes.io/name: insightd
    app.kubernetes.io/part-of: tally
    app.kubernetes.io/component: ai-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insightd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insightd
        app.kubernetes.io/part-of: tally
        app.kubernetes.io/component: ai-plane
    spec:
      serviceAccountName: insightd
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: insightd
          image: insightd:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc:4317
            - name: OTEL_SERVICE_NAME
              value: insightd
          envFrom:
            - secretRef:
                name: insightd-config
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: insightd
  namespace: tally
  labels:
    app.kubernetes.io/name: insightd
---
apiVersion: v1
kind: Service
metadata:
  name: insightd
  namespace: tally
  labels:
    app.kubernetes.io/name: insightd
spec:
  selector:
    app.kubernetes.io/name: insightd
  ports:
    - name: http
      port: 8000
      targetPort: http
