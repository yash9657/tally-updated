# cored — the Go 1.26 modular-monolith (system of record, atomic voucher post,
# ledger, compliance-derive, reporting). The keystroke-critical write path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cored
  namespace: tally
  labels:
    app.kubernetes.io/name: cored
    app.kubernetes.io/part-of: tally
    app.kubernetes.io/component: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cored
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cored
        app.kubernetes.io/part-of: tally
        app.kubernetes.io/component: core
    spec:
      serviceAccountName: cored
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # nonroot (distroless)
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cored
          image: cored:dev # overlay/CI sets the real registry + digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc:4317
            - name: OTEL_SERVICE_NAME
              value: cored
          # DATABASE_URL is injected from a Secret (Vault dynamic creds in prod).
          envFrom:
            - secretRef:
                name: cored-db
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cored
  namespace: tally
  labels:
    app.kubernetes.io/name: cored
---
apiVersion: v1
kind: Service
metadata:
  name: cored
  namespace: tally
  labels:
    app.kubernetes.io/name: cored
spec:
  selector:
    app.kubernetes.io/name: cored
  ports:
    - name: http
      port: 8080
      targetPort: http
