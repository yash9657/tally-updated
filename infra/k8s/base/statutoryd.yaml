# statutoryd — the separately-deployable Go compliance gateway (IRN / e-way
# bill / GSTR filing / IMS) driven by durable workflows. Long-running and
# external-facing, isolated from the keystroke write path (PLAN.md A.1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statutoryd
  namespace: tally
  labels:
    app.kubernetes.io/name: statutoryd
    app.kubernetes.io/part-of: tally
    app.kubernetes.io/component: compliance-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: statutoryd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statutoryd
        app.kubernetes.io/part-of: tally
        app.kubernetes.io/component: compliance-gateway
    spec:
      serviceAccountName: statutoryd
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: statutoryd
          image: statutoryd:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc:4317
            - name: OTEL_SERVICE_NAME
              value: statutoryd
          envFrom:
            - secretRef:
                name: statutoryd-config
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: statutoryd
  namespace: tally
  labels:
    app.kubernetes.io/name: statutoryd
---
apiVersion: v1
kind: Service
metadata:
  name: statutoryd
  namespace: tally
  labels:
    app.kubernetes.io/name: statutoryd
spec:
  selector:
    app.kubernetes.io/name: statutoryd
  ports:
    - name: http
      port: 8080
      targetPort: http
