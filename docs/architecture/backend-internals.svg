<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010" role="img" aria-labelledby="title desc">
  <title id="title">cored internals</title>
  <desc id="desc">Inside cored: a chi router with public, authenticated, company-scoped and cron route groups; the company subtree runs the policy decision point before any handler. Handlers delegate to domain modules and to the agent plane, which writes only by dispatching through the same router. All modules share one pgx pool as the tally_app role, with RLS scoped by transaction-local settings. Background pollers run as goroutines on a long-lived process and are replaced by scheduled cron routes on Lambda.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .h1 { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: #475569; }
      .sec { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.4px; }
      .h { font-size: 13px; font-weight: 700; }
      .t { font-size: 12.5px; }
      .s { font-size: 12px; fill: #475569; }
      .m { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .edge { stroke: #334155; stroke-width: 1.6; fill: none; }
      .cron { stroke: #c2410c; stroke-width: 1.6; fill: none; stroke-dasharray: 7 4; }
      .box { fill: #f1f5f9; stroke: #475569; stroke-width: 1.3; }
      .wbox { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1010" rx="16" fill="#ffffff"/>

  <text class="h1" x="28" y="40">cored — internal architecture</text>
  <text class="sub" x="28" y="62">One Go binary (backend/cmd/cored): <tspan class="m">cored serve</tspan> runs the API, <tspan class="m">cored migrate</tspan> applies the embedded schema. server/ is the only composition root.</text>

  <!-- Ingress -->
  <rect x="28" y="82" width="460" height="48" rx="10" fill="#fff7ed" stroke="#FF9900" stroke-width="1.6"/>
  <text class="h" x="44" y="103">HTTP request</text>
  <text class="s" x="44" y="121">Function URL event → Lambda Web Adapter → :8080 (or any HTTP host)</text>
  <rect x="712" y="82" width="460" height="48" rx="10" fill="#fff7ed" stroke="#FF9900" stroke-width="1.6"/>
  <text class="h" x="728" y="103">EventBridge Scheduler invocation</text>
  <text class="s" x="728" y="121">GET /internal/cron/tick (hourly) · /internal/cron/anchor (21:30 UTC)</text>

  <!-- Router -->
  <rect x="28" y="152" width="1144" height="176" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text class="sec" x="44" y="174">HTTP LAYER · chi router · RequestID · Recoverer · per-route body caps (1 MiB JSON, 128 MiB Tally XML)</text>

  <rect x="44" y="186" width="250" height="128" rx="8" class="wbox"/>
  <text class="h" x="56" y="206">Public</text>
  <text class="m" x="56" y="228">/healthz</text>
  <text class="m" x="56" y="246">/auth/login</text>
  <text class="m" x="56" y="264">/auth/webauthn/*</text>
  <text class="s" x="56" y="286">/auth/token (dev) not mounted</text>
  <text class="s" x="56" y="302">on AWS</text>

  <rect x="306" y="186" width="250" height="128" rx="8" class="wbox"/>
  <text class="h" x="318" y="206">authnOnly middleware</text>
  <text class="s" x="318" y="226">JWT verified, no company yet</text>
  <text class="m" x="318" y="248">POST /v1/companies</text>
  <text class="m" x="318" y="266">POST /v1/companies/restore</text>
  <text class="m" x="318" y="284">GET  /v1/me</text>

  <rect x="568" y="186" width="360" height="128" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text class="h" x="580" y="206">/v1/companies/{id}/* · companyAuthMiddleware</text>
  <text class="t" x="580" y="228">1 verify JWT (dev-signing key or JWKS)</text>
  <text class="t" x="580" y="246">2 revoked session? → subject → user</text>
  <text class="t" x="580" y="264">3 membership → security level + rules</text>
  <text class="t" x="580" y="282">4 authz.Evaluate = PDP (action, resource)</text>
  <text class="t" x="580" y="300">5 deny 403 · STEPUP_REQUIRED · allow → ctx</text>

  <rect x="940" y="186" width="218" height="128" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text class="h" x="952" y="206">/internal/cron/*</text>
  <text class="s" x="952" y="226">mounted only if CRON_SECRET</text>
  <text class="s" x="952" y="244">is set; Bearer compared in</text>
  <text class="s" x="952" y="262">constant time. One pass of</text>
  <text class="s" x="952" y="280">each background job, then</text>
  <text class="s" x="952" y="298">returns JSON counts.</text>

  <!-- ingress arrows -->
  <line class="edge" x1="258" y1="130" x2="258" y2="150" marker-end="url(#arr)"/>
  <line class="cron" x1="1050" y1="130" x2="1050" y2="184" marker-end="url(#arro)"/>

  <!-- Domain modules -->
  <rect x="28" y="350" width="744" height="292" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <text class="sec" x="44" y="372">DOMAIN MODULES · internal/* (archtest pins the import graph)</text>

  <g>
    <rect x="44" y="384" width="232" height="56" rx="8" class="box"/>
    <text class="h" x="56" y="404">ledger</text>
    <text class="s" x="56" y="424">vouchers, versioned + hash-chained</text>

    <rect x="288" y="384" width="232" height="56" rx="8" class="box"/>
    <text class="h" x="300" y="404">masters · inventory · orders</text>
    <text class="s" x="300" y="424">ledgers, groups, stock, BOMs</text>

    <rect x="532" y="384" width="224" height="56" rx="8" class="box"/>
    <text class="h" x="544" y="404">reporting</text>
    <text class="s" x="544" y="424">TB, BS, P&amp;L, day book, stock</text>

    <rect x="44" y="450" width="232" height="56" rx="8" class="box"/>
    <text class="h" x="56" y="470">compliance · payroll</text>
    <text class="s" x="56" y="490">GSTR-1/3B/9, ITC/IMS, TDS/TCS</text>

    <rect x="288" y="450" width="232" height="56" rx="8" class="box"/>
    <text class="h" x="300" y="470">einvoice · ewaybill</text>
    <text class="s" x="300" y="490">IRN via statutoryd (HTTP proxy)</text>

    <rect x="532" y="450" width="224" height="56" rx="8" class="box"/>
    <text class="h" x="544" y="470">banking · bankstatement</text>
    <text class="s" x="544" y="490">import, match, reconcile</text>

    <rect x="44" y="516" width="232" height="56" rx="8" class="box"/>
    <text class="h" x="56" y="536">identity · authz · webauthn</text>
    <text class="s" x="56" y="556">members, levels, rules, passkeys</text>

    <rect x="288" y="516" width="232" height="56" rx="8" class="box"/>
    <text class="h" x="300" y="536">migration · sync · backup</text>
    <text class="s" x="300" y="556">Tally-XML import, restore</text>

    <rect x="532" y="516" width="224" height="56" rx="8" class="box"/>
    <text class="h" x="544" y="536">nlq → query</text>
    <text class="s" x="544" y="556">NL → typed DSL → compiler</text>

    <rect x="44" y="582" width="232" height="50" rx="8" class="box"/>
    <text class="h" x="56" y="602">insights (+ narrate, profile)</text>
    <text class="s" x="56" y="620">detectors, rank, digest</text>

    <rect x="288" y="582" width="232" height="50" rx="8" class="box"/>
    <text class="h" x="300" y="602">notify</text>
    <text class="s" x="300" y="620">transactional outbox</text>

    <rect x="532" y="582" width="224" height="50" rx="8" class="box"/>
    <text class="h" x="544" y="602">insightd proxy</text>
    <text class="s" x="544" y="620">/drafts + service token</text>
  </g>

  <!-- Agent plane -->
  <rect x="792" y="350" width="380" height="292" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <text class="sec" x="808" y="372">AGENT PLANE</text>
  <text class="s" x="910" y="372">writes re-enter the router (same PDP) ↑</text>
  <rect x="808" y="384" width="348" height="44" rx="8" class="box"/>
  <text class="h" x="820" y="402">mcp</text>
  <text class="s" x="860" y="402">JSON-RPC, per-grant transport token;</text>
  <text class="s" x="820" y="419">tools/call → the same agent engine</text>
  <rect x="808" y="436" width="348" height="44" rx="8" class="box"/>
  <text class="h" x="820" y="454">agent</text>
  <text class="s" x="866" y="454">durable run loop (decide → tool → gate</text>
  <text class="s" x="820" y="471">→ await approval → exec), approval inbox</text>
  <rect x="808" y="488" width="348" height="44" rx="8" class="box"/>
  <text class="h" x="820" y="506">policy</text>
  <text class="s" x="870" y="506">rights = user ∩ agent ∩ delegation;</text>
  <text class="s" x="820" y="523">autonomy table; untrusted text ⇒ human</text>
  <rect x="808" y="540" width="348" height="44" rx="8" class="box"/>
  <text class="h" x="820" y="558">actions</text>
  <text class="s" x="876" y="558">ActionSpec registry generated from</text>
  <text class="s" x="820" y="575">the router (search / read / preview / commit)</text>
  <rect x="808" y="592" width="348" height="42" rx="8" class="box"/>
  <text class="h" x="820" y="610">intentlog</text>
  <text class="s" x="888" y="610">BLAKE3 chain per run, append-only;</text>
  <text class="s" x="820" y="626">daily anchor over all run heads</text>

  <!-- router -> modules; agent -> router dispatch -->
  <line class="edge" x1="400" y1="328" x2="400" y2="348" marker-end="url(#arr)"/>
  <line class="edge" x1="900" y1="328" x2="900" y2="348" marker-end="url(#arr)"/>
  <line class="edge" x1="1120" y1="350" x2="1120" y2="330" marker-end="url(#arr)" stroke-dasharray="3 3"/>

  <!-- Platform -->
  <rect x="28" y="664" width="1144" height="104" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <text class="sec" x="44" y="686">PLATFORM</text>
  <rect x="44" y="696" width="356" height="62" rx="8" class="box"/>
  <text class="h" x="56" y="716">platform/db · one pgx pool as tally_app</text>
  <text class="s" x="56" y="734">RunInTx sets app.current_company_id, subject,</text>
  <text class="s" x="56" y="750">user (txn-local); RunInReadOnlyTx for queries</text>
  <rect x="412" y="696" width="248" height="62" rx="8" class="box"/>
  <text class="h" x="424" y="716">llm · provider abstraction</text>
  <text class="s" x="424" y="734">6 adapters, stdlib HTTP, per-</text>
  <text class="s" x="424" y="750">tenant token budget, spans</text>
  <rect x="672" y="696" width="236" height="62" rx="8" class="box"/>
  <text class="h" x="684" y="716">durable · step replay</text>
  <text class="s" x="684" y="734">recorded steps, per-run advisory</text>
  <text class="s" x="684" y="750">lock, park/resume (agent, IRN)</text>
  <rect x="920" y="696" width="236" height="62" rx="8" class="box"/>
  <text class="h" x="932" y="716">trajectory · OTLP exporter</text>
  <text class="s" x="932" y="734">off unless OTEL_EXPORTER_</text>
  <text class="s" x="932" y="750">OTLP_TRACES_ENDPOINT is set</text>
  <line class="edge" x1="400" y1="642" x2="400" y2="662" marker-end="url(#arr)"/>
  <line class="edge" x1="982" y1="642" x2="982" y2="662" marker-end="url(#arr)"/>

  <!-- Background jobs -->
  <rect x="28" y="790" width="740" height="200" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text class="sec" x="44" y="812">BACKGROUND WORK · goroutine on a long-lived host  →  route on Lambda</text>
  <rect x="44" y="824" width="708" height="26" rx="4" fill="#f1f5f9"/>
  <text class="h" x="56" y="842">Job</text>
  <text class="h" x="246" y="842">cored serve (container, local)</text>
  <text class="h" x="500" y="842">Lambda: /internal/cron/*</text>
  <text class="t" x="56" y="870">Notification outbox</text>
  <text class="s" x="246" y="870">every 15 s</text>
  <text class="m" x="500" y="870">tick → DispatchNotifications</text>
  <text class="t" x="56" y="892">Agent poller (parked, retries)</text>
  <text class="s" x="246" y="892">every 2 s</text>
  <text class="m" x="500" y="892">tick → AgentPollOnce</text>
  <text class="t" x="56" y="914">Insight events + nightly</text>
  <text class="s" x="246" y="914">every 5 s; night after 02:00 IST</text>
  <text class="m" x="500" y="914">tick → EventsOnce, NightlyOnce</text>
  <text class="t" x="56" y="936">Intent-log anchors</text>
  <text class="s" x="246" y="936">every 24 h</text>
  <text class="m" x="500" y="936">anchor → AgentAnchorOnce</text>
  <text class="s" x="56" y="966">On Lambda the goroutines still start but freeze between invocations. Every job is idempotent</text>
  <text class="s" x="56" y="982">(advisory locks · SKIP LOCKED · UNIQUE run keys), so a cron pass overlapping a warm poller is harmless.</text>

  <!-- Database -->
  <rect x="788" y="790" width="384" height="200" rx="12" fill="#fff7ed" stroke="#FF9900" stroke-width="1.6"/>
  <text class="sec" x="804" y="812">POSTGRESQL (Aurora)</text>
  <text class="t" x="804" y="836">FORCE RLS, default deny; policies read the</text>
  <text class="t" x="804" y="854">transaction-local company GUC.</text>
  <text class="h" x="804" y="880">Roles</text>
  <text class="m" x="804" y="900">admin</text>
  <text class="s" x="900" y="900">cored migrate; creates roles</text>
  <text class="m" x="804" y="918">tally_app</text>
  <text class="s" x="900" y="918">cored serve (least privilege)</text>
  <text class="m" x="804" y="936">tally_statutory</text>
  <text class="s" x="928" y="936">statutoryd step store</text>
  <text class="m" x="804" y="954">agent_ro</text>
  <text class="s" x="900" y="954">Tier B published views</text>
  <text class="s" x="804" y="978">Migrations: embedded SQL, session advisory lock.</text>
  <line class="edge" x1="980" y1="768" x2="980" y2="788" marker-end="url(#arr)"/>
</svg>
